<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas Graph Spike</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0e;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}
  canvas.drag{cursor:grabbing}
  #opts{position:fixed;right:12px;top:12px;color:#c4c4d0;font:13px -apple-system,system-ui,sans-serif;background:#14141acc;padding:8px 12px;border-radius:8px;user-select:none;display:flex;flex-direction:column;gap:6px}
  #opts label{cursor:pointer}
  #opts select{background:#1a1a22;color:#e6e6ee;border:1px solid #2a2a36;border-radius:6px;padding:2px 6px;margin-left:4px}
  #opts span{color:#6d6d7a}
  #opts input{vertical-align:-2px;margin-right:6px}
  #hud{position:fixed;left:12px;top:12px;color:#8a8a96;font:12px/1.5 ui-monospace,monospace;background:#14141acc;padding:8px 10px;border-radius:8px;pointer-events:none;white-space:pre}
  #edgepanel{position:fixed;right:12px;top:92px;width:272px;box-sizing:border-box;color:#c4c4d0;font:13px -apple-system,system-ui,sans-serif;background:#14141aee;padding:12px 14px;border-radius:10px;border:1px solid #262630}
  #edgepanel[hidden]{display:none}
  #edgepanel .t{font-weight:600;color:#f1f1f6;margin-bottom:8px}
  #edgepanel .r{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px solid #1f1f28}
  #edgepanel .r span{color:#6d6d7a;white-space:nowrap}
  #edgepanel .r b{font-weight:500;text-align:right;word-break:break-word}
  #edgepanel button{margin-top:10px;width:100%;padding:8px;border-radius:8px;border:1px solid #5a2630;background:#2a1519;color:#ff8a98;font:600 13px -apple-system,system-ui,sans-serif;cursor:pointer}
  #edgepanel button:hover{background:#3a1b21}
  #edgepanel kbd{opacity:.6;font:12px ui-monospace,monospace;margin-left:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="edgepanel" hidden>
  <div class="t" id="ep-title"></div>
  <div id="ep-rows"></div>
  <div id="ep-actions"></div>
</div>
<div id="opts">
  <label><input type="checkbox" id="full"> Full path selection <span>(F)</span></label>
  <label>Simulated save <select id="save"><option value="slow">slow (1.5s)</option><option value="fail">slow, then fails</option><option value="instant">instant</option></select></label>
</div>
<script>
// ---------- model ----------
const COLOR = { source:'#ffd24a', switch:'#ff7a59', process:'#b05cff', storage:'#2fe6e6', gpu:'#ff4fa3',
  aggregator:'#6ee7a0', sink:'#5aa9ff', ingest:'#ffd24a', route:'#ff7a59', enrich:'#b05cff', relay:'#2fe6e6', store:'#5aa9ff', parse:'#ff4fa3' };
const nodes = [], edges = [], comps = [];
const pendingEdges = new Set(); let pulseUntil = 0; // connections created by a gesture that the host hasn't confirmed yet
let gconn = null, edgeSeq = 0, selGE = null, hoverGE = null, selGroup = null; // selected / hovered group pipe, selected group
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function N(comp, type, name) {
  const n = { id: nodes.length, comp, type, name, x: 0, y: 0, w: 200, h: 84, in: [], out: [], ins: [], outs: [], g: null, layer: 0,
    gl: 0, status: rnd() < .06 ? 'degraded' : 'ready', hi: 0, ho: 0, stamp: 0 };
  nodes.push(n); comp.nodes.push(n); return n;
}
function E(a, b, ap = 'A', bp = '1') { const e = { id: edgeSeq++, a, b, fp: portNamed(a, 'out', ap), tp: portNamed(b, 'in', bp), ai: 0, bi: 0, back: false, enabled: true, stamp: 0 }; edges.push(e); a.out.push(e); b.in.push(e); }
function portNamed(n, side, name) { // demo data only: a real graph brings its own port objects
  const list = side === 'out' ? n.outs : n.ins; let p = list.find(x => x.name === name);
  if (!p) { p = { id: `${n.id}:${side}:${name}`, name }; list.push(p); } return p;
}

// 10 -> 1 -> N -> 1 -> 5
function pipelineA(nProc) {
  const c = { nodes: [], name: `fan ${nProc}` }; comps.push(c);
  const src = Array.from({ length: 10 }, (_, i) => N(c, 'source', `Source ${i}`));
  const sw = N(c, 'switch', 'Switch');
  const procs = Array.from({ length: nProc }, (_, i) => N(c, rnd() < .6 ? 'process' : rnd() < .6 ? 'storage' : 'gpu', `Asset ${i}`));
  const agg = N(c, 'aggregator', 'Aggregator');
  const out = Array.from({ length: 5 }, (_, i) => N(c, 'sink', `Sink ${i}`));
  src.forEach((s, i) => E(s, sw, 'A', String(i + 1))); procs.forEach(p => { E(sw, p); E(p, agg); }); out.forEach((o, i) => E(agg, o, 'ABCDE'[i]));
}
// a1-a2-a3-(fan)-a4-a5-a2(back)  a2-a6-a7-a8
function pipelineB(nPar) {
  const c = { nodes: [], name: `loop ${nPar}` }; comps.push(c);
  const a = (t, i) => N(c, t, `a${i}`);
  const a1 = a('source', 1), a2 = a('ingest', 2), a3 = a('route', 3), a4 = a('relay', 4), a5 = a('store', 5),
        a6 = a('aggregator', 6), a7 = a('process', 7), a8 = a('sink', 8);
  const par = Array.from({ length: nPar }, (_, i) => N(c, 'enrich', `par ${i}`));
  E(a1, a2); E(a2, a3); par.forEach(p => { E(a3, p); E(p, a4); }); E(a4, a5); E(a5, a2, 'A', '2'); E(a2, a6, 'B'); E(a6, a7); E(a7, a8);
}
// your example: a4 has 3 outputs (a5, a6, loop back to a2) plus a skip edge a1 -> a4
function pipelineC() {
  const c = { nodes: [], name: 'branch' }; comps.push(c);
  const a = (t, i) => N(c, t, `a${i}`);
  const a1 = a('source', 1), a2 = a('ingest', 2), a3 = a('route', 3), a4 = a('relay', 4), a5 = a('store', 5), a6 = a('sink', 6);
  E(a1, a2); E(a2, a3); E(a3, a4); E(a4, a5, 'A'); E(a4, a6, 'B'); E(a4, a2, 'C', '2'); E(a1, a4, 'B', '2');
}
pipelineC(); pipelineA(800); pipelineB(40); pipelineA(400); pipelineB(150);

const PORT_Y0 = 62, PORT_DY = 20;
const natural = (p, q) => (isNaN(p) || isNaN(q)) ? String(p).localeCompare(q) : p - q;
const byName = (p, q) => natural(p.name, q.name) || String(p.id).localeCompare(String(q.id));
function finalizePorts() {
  for (const n of nodes) {
    n.ins.sort(byName); n.outs.sort(byName);
    n.h = PORT_Y0 + PORT_DY * Math.max(1, n.ins.length, n.outs.length) + 22;
  }
  for (const e of edges) { e.ai = e.a.outs.indexOf(e.fp); e.bi = e.b.ins.indexOf(e.tp); }
}
finalizePorts();
const portY = (n, k) => n.y + PORT_Y0 + k * PORT_DY;

// ---------- layout: break cycles, layer, group by (layer,type) ----------
const GAP_LAYER = 420, GAP_GROUP = 80; // frame-to-frame distance between columns / stacked groups
const PAD = 40, CW = 230, CH = 110, groups = [], gedges = [];
function layout() {
  groups.length = 0; for (const n of nodes) { n.layer = 0; n.g = null; } for (const e of edges) e.back = false; // idempotent: relayout() runs this again
  const st = new Int8Array(nodes.length);
  let compTop = 0;
  for (const c of comps) {
    // cycle breaking (iterative DFS; edges into a node on the stack are back edges)
    const roots = c.nodes.filter(n => !n.in.length).concat(c.nodes);
    for (const r of roots) {
      if (st[r.id]) continue; st[r.id] = 1;
      const stack = [[r, 0]];
      while (stack.length) {
        const top = stack[stack.length - 1], n = top[0];
        if (top[1] < n.out.length) {
          const e = n.out[top[1]++], m = e.b;
          if (st[m.id] === 1) e.back = true; else if (!st[m.id]) { st[m.id] = 1; stack.push([m, 0]); }
        } else { st[n.id] = 2; stack.pop(); }
      }
    }
    // longest-path layering over non-back edges
    const deg = new Map(c.nodes.map(n => [n, n.in.filter(e => !e.back).length]));
    const q = c.nodes.filter(n => deg.get(n) === 0);
    while (q.length) {
      const n = q.pop();
      for (const e of n.out) if (!e.back) { const m = e.b; m.layer = Math.max(m.layer, n.layer + 1); deg.set(m, deg.get(m) - 1); if (!deg.get(m)) q.push(m); }
    }
    // group by (layer,type)
    const gm = new Map(), layers = [];
    for (const n of c.nodes) {
      const k = n.layer + '|' + n.type; let g = gm.get(k);
      if (!g) { g = { id: groups.length, comp: c, layer: n.layer, type: n.type, nodes: [], x: 0, y: 0, w: 0, h: 0, rows: 1 }; groups.push(g); gm.set(k, g); (layers[n.layer] ||= []).push(g); }
      g.nodes.push(n); n.g = g;
    }
    for (const g of groups.filter(g => g.comp === c)) {
      const cnt = g.nodes.length; g.mh = Math.max(...g.nodes.map(n => n.h)); g.rh = g.mh + 30; g.rows = Math.max(1, Math.ceil(Math.sqrt(cnt * CW / g.rh)));
      const cols = Math.ceil(cnt / g.rows);
      g.w = (cols - 1) * CW + 200; g.h = (Math.min(cnt, g.rows) - 1) * g.rh + g.mh;
    }
    // positions: layers left to right, groups stacked and centered
    // spine: the largest group per layer sits on the baseline, siblings stack below it
    layers.forEach(L => L.sort((p, q) => q.nodes.length - p.nodes.length || p.id - q.id));
    const base = Math.max(...layers.map(L => L[0].h / 2 + PAD));
    const below = Math.max(...layers.map(L => L[0].h / 2 + PAD + L.slice(1).reduce((s, g) => s + g.h + 2 * PAD + GAP_GROUP, 0)));
    const compH = base + below; let x = 0;
    layers.forEach(L => {
      const lw = Math.max(...L.map(g => g.w)); let y = compTop + base - L[0].h / 2;
      for (const g of L) {
        g.x = x + (lw - g.w) / 2; g.y = y;
        g.nodes.forEach((n, i) => { n.x = g.x + Math.floor(i / g.rows) * CW; n.y = g.y + (i % g.rows) * g.rh; });
        y += g.h + 2 * PAD + GAP_GROUP;
      }
      x += lw + 2 * PAD + GAP_LAYER;
    });
    c.bbox = { x: -PAD, y: compTop, w: x - GAP_LAYER, h: compH }; c.bbox0 = { y: compTop, h: compH };
    compTop += compH + 1600;
  }
}
function routeEdges() {
  gedges.length = 0;
  const gm = new Map();
  for (const e of edges) {
    const k = e.a.g.id + (e.back ? '<' : '>') + e.b.g.id; let ge = gm.get(k);
    if (!ge) { ge = { a: e.a.g, b: e.b.g, count: 0, back: e.back, skip: !e.back && e.b.layer - e.a.layer > 1, laneY: undefined, edges: [] }; gm.set(k, ge); gedges.push(ge); }
    ge.count++; ge.edges.push(e); e.ge = ge;
  }
  // loops route over the top, layer-skipping edges underneath, in stacked non-overlapping lanes
  for (const c of comps) {
    const cg = groups.filter(g => g.comp === c);
    let top = c.bbox0.y, bot = c.bbox0.y + c.bbox0.h;
    for (const side of ['back', 'skip']) {
      const list = gedges.filter(ge => ge.a.comp === c && ge[side])
        .map(ge => ({ ge, lo: Math.min(ge.a.layer, ge.b.layer), hi: Math.max(ge.a.layer, ge.b.layer) }))
        .sort((p, q) => (p.hi - p.lo) - (q.hi - q.lo));
      const lanes = [];
      for (const it of list) {
        let k = lanes.findIndex(L => L.every(o => o.hi < it.lo || o.lo > it.hi));
        if (k < 0) { k = lanes.length; lanes.push([]); }
        lanes[k].push(it);
        const span = cg.filter(g => g.layer >= it.lo && g.layer <= it.hi);
        it.ge.laneY = side === 'back' ? Math.min(...span.map(g => g.y - PAD)) - 140 - k * 140
                                      : Math.max(...span.map(g => g.y + g.h + PAD)) + 140 + k * 140;
        top = Math.min(top, it.ge.laneY - 60); bot = Math.max(bot, it.ge.laneY + 60);
      }
    }
    c.bbox.y = top; c.bbox.h = bot - top;
  }
  const same = g => g && gedges.find(x => x.a.nodes[0] === g.a.nodes[0] && x.b.nodes[0] === g.b.nodes[0] && x.back === g.back) || null;
  selGE = same(selGE); hoverGE = same(hoverGE);
}
layout(); routeEdges();

function addEdgeRaw(a, ai, b, bi, enabled = true) { // egress port #ai of a -> ingress port #bi of b; caller routes
  const fp = a.outs[ai], tp = b.ins[bi];
  if (!fp || !tp || a === b || a.out.some(e => e.b === b && e.fp === fp && e.tp === tp)) return null;
  const e = { id: edgeSeq++, a, b, fp, tp, ai, bi, back: b.layer <= a.layer, enabled, stamp: 0 };
  edges.push(e); a.out.push(e); b.in.push(e); return e;
}
let needRelayout = false;
function ensurePort(n, side, spec) { // spec: a port id, or { id, name }. The host owns ports; an unseen one is added to the card.
  const want = typeof spec === 'object' ? spec : { id: spec, name: String(spec) }, list = side === 'out' ? n.outs : n.ins;
  let p = list.find(x => x.id === want.id);
  if (p) return p;
  p = { id: want.id, name: want.name ?? String(want.id) }; list.push(p); list.sort(byName);
  for (const e of n.out) e.ai = n.outs.indexOf(e.fp); for (const e of n.in) e.bi = n.ins.indexOf(e.tp);
  const h = PORT_Y0 + PORT_DY * Math.max(1, n.ins.length, n.outs.length) + 22;
  if (h > n.h) { n.h = h; if (h > n.g.mh) needRelayout = true; } // taller than its grid cell: positions must be recomputed
  return p;
}
function addEdgeByPort(a, fromPort, b, toPort, enabled = true) {
  if (!a || !b || a === b || fromPort == null || toPort == null) return null;
  const fp = ensurePort(a, 'out', fromPort), tp = ensurePort(b, 'in', toPort);
  return addEdgeRaw(a, a.outs.indexOf(fp), b, b.ins.indexOf(tp), enabled);
}
function connect(a, ai, b, bi) { const e = addEdgeRaw(a, ai, b, bi); if (e) routeEdges(); return e; }

// spatial grid for culling / picking
const CELL = 800, grid = new Map(), gk = (cx, cy) => cx * 100003 + cy;
function buildGrid() {
  grid.clear();
  for (const n of nodes)
    for (let cx = Math.floor(n.x / CELL); cx <= Math.floor((n.x + n.w) / CELL); cx++)
      for (let cy = Math.floor(n.y / CELL); cy <= Math.floor((n.y + n.h) / CELL); cy++) {
        const k = gk(cx, cy); (grid.get(k) || grid.set(k, []).get(k)).push(n);
      }
}
buildGrid();
function queryNodes(x0, y0, x1, y1) {
  const out = new Set();
  for (let cx = Math.floor(x0 / CELL); cx <= Math.floor(x1 / CELL); cx++)
    for (let cy = Math.floor(y0 / CELL); cy <= Math.floor(y1 / CELL); cy++) { const b = grid.get(gk(cx, cy)); if (b) for (const n of b) out.add(n); }
  return out;
}
function pick(x, y) {
  const b = grid.get(gk(Math.floor(x / CELL), Math.floor(y / CELL)));
  if (b) for (const n of b) if (x >= n.x && x <= n.x + n.w && y >= n.y && y <= n.y + n.h) return n;
  return null;
}

// ---------- selection (upstream + downstream) ----------
const selNodes = new Set(), selGroups = new Set(), selEdges = new Set();
let selected = null, hover = null, fullPath = false;
function computeSel(n) {
  selNodes.clear(); selGroups.clear(); selEdges.clear(); selected = n; if (!n) return;
  for (const dir of ['out', 'in']) {
    const seen = new Set([n]), q = [[n, fullPath ? Infinity : 1]]; // direct neighbours only unless full path is on
    while (q.length) {
      const [m, left] = q.pop(); if (left <= 0) continue;
      for (const e of m[dir]) { selEdges.add(e); const o = dir === 'out' ? e.b : e.a; if (!seen.has(o)) { seen.add(o); q.push([o, left - 1]); } }
    }
    for (const m of seen) selNodes.add(m);
  }
  for (const m of selNodes) selGroups.add(m.g);
}

// ---------- view / input ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud');
const DPR = Math.min(devicePixelRatio || 1, 2);
let W, H, dirty = true, time = 0, mouse = { x: 0, y: 0 }, drag = null;
const view = { x: 0, y: 0, s: .04 };
let ts = .04, ax = 0, ay = 0, wx = 0, wy = 0; // target scale + anchor (screen point <-> world point)
const toWorld = (px, py) => ({ x: px / view.s + view.x, y: py / view.s + view.y });
const syncAnchor = () => { const p = toWorld(ax, ay); wx = p.x; wy = p.y; };
function resize() { W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; dirty = true; }
addEventListener('resize', resize); resize();
function focus(b) {
  ts = Math.min(2.2, Math.min(W / (b.w + 400), H / (b.h + 400))); ax = W / 2; ay = H / 2; wx = b.x + b.w / 2; wy = b.y + b.h / 2; dirty = true;
}
{ const xs = comps.map(c => c.bbox), x1 = Math.max(...xs.map(b => b.x + b.w)), y1 = Math.max(...xs.map(b => b.y + b.h));
  focus({ x: 0, y: 0, w: x1, h: y1 }); view.s = ts; view.x = wx - ax / ts; view.y = wy - ay / ts; }

cv.addEventListener('wheel', e => {
  e.preventDefault(); ax = e.clientX; ay = e.clientY; const v = { ...view }; syncAnchor();
  ts = Math.min(2.2, Math.max(.012, ts * Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)))); dirty = true;
}, { passive: false });
let conn = null, retract = null, flash = null; // live drag wire, snap-back animation, connect flash
let selEdge = null, hoverEdge = null, ghost = null, pickStamp = 0; const undo = []; // selected/hovered wire, fading deleted wire, deleted wires
function segDist(x, y, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy, t = l2 ? Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / l2)) : 0;
  return Math.hypot(x - (a.x + t * dx), y - (a.y + t * dy));
}
function pickEdge(x, y, vis) { // nearest wire within 9px of the cursor, among wires touching visible cards
  const tol = 9 / view.s, stamp = ++pickStamp; let best = null, bd = tol;
  for (const n of vis) for (const list of [n.out, n.in]) for (const e of list) {
    if (e.pstamp === stamp) continue; e.pstamp = stamp;
    const A = e.a, B = e.b, x0 = A.x + A.w, x1 = B.x, y0 = portY(A, e.ai), y1 = portY(B, e.bi), ly = e.ge.laneY;
    let lo = Math.min(y0, y1), hi = Math.max(y0, y1); if (ly !== undefined) { lo = Math.min(lo, ly); hi = Math.max(hi, ly); }
    if (x < Math.min(x0, x1) - 80 - tol || x > Math.max(x0, x1) + 80 + tol || y < lo - tol || y > hi + tol) continue;
    const pts = sampleSegs(edgeSegs(e), 32);
    for (let i = 1; i < pts.length; i++) { const d = segDist(x, y, pts[i - 1], pts[i]); if (d < bd) { bd = d; best = e; } }
  }
  return best;
}
// ---------- host API: the canvas emits plain-data events and exposes commands; the panel below is just one subscriber ----------
const listeners = {}, $ = id => document.getElementById(id), panel = $('edgepanel');
function emit(type, data) { for (const fn of listeners[type] || []) fn(data); }
const gsum = g => ({ id: g.id, type: g.type, layer: g.layer, count: g.nodes.length });
const routeOf = (a, b, back, skip) => back ? 'loop back' : skip ? `skips ${b.layer - a.layer - 1} layer(s)` : 'forward';
const hist = (list, key) => { const m = new Map(); for (const e of list) m.set(e[key].name, (m.get(e[key].name) || 0) + 1); return [...m].map(([name, count]) => ({ name, count })).sort((p, q) => q.count - p.count); }; // by port NAME across a group; ids differ per asset
const pinfo = p => ({ id: p.id, name: p.name });
const endpoint = (n, port) => ({ id: n.id, name: n.name, type: n.type, port: pinfo(port) });
function describeNode(n) {
  return { kind: 'node', id: n.id, name: n.name, type: n.type, layer: n.layer, status: n.status, group: gsum(n.g), inCount: n.in.length, outCount: n.out.length,
    ingressPorts: n.ins.map(p => ({ ...pinfo(p), count: n.in.filter(e => e.tp === p).length })), egressPorts: n.outs.map(p => ({ ...pinfo(p), count: n.out.filter(e => e.fp === p).length })) };
}
const describeEdge = e => ({ kind: 'edge', id: e.id, from: endpoint(e.a, e.fp), to: endpoint(e.b, e.tp), route: routeOf(e.a, e.b, e.back, e.ge.skip), enabled: e.enabled !== false, pending: !!e.pending, fromGroup: gsum(e.a.g), toGroup: gsum(e.b.g) });
const describeGE = ge => ({ kind: 'groupEdge', from: gsum(ge.a), to: gsum(ge.b), count: ge.edges.length, route: routeOf(ge.a, ge.b, ge.back, ge.skip),
  egressPorts: hist(ge.edges, 'fp'), ingressPorts: hist(ge.edges, 'tp'), enabled: ge.edges.filter(e => e.enabled !== false).length, edgeIds: ge.edges.map(e => e.id) });
function describeGroup(g) {
  const out = gedges.filter(x => x.a === g).map(x => ({ ...gsum(x.b), edges: x.edges.length })), inn = gedges.filter(x => x.b === g).map(x => ({ ...gsum(x.a), edges: x.edges.length }));
  return { kind: 'group', ...gsum(g), degraded: g.nodes.filter(n => n.status === 'degraded').length, nodeIds: g.nodes.map(n => n.id), outgoing: out, incoming: inn };
}
function payload() {
  if (selEdge) return describeEdge(selEdge); if (selGE) return describeGE(selGE); if (selGroup) return describeGroup(selGroup); if (selected) return describeNode(selected); return null;

    const r = ELEC_PX / s; let best = null, bd = r;
    for (const o of vis) {
      if (o === conn.from) continue;
      const arr = conn.dir > 0 ? o.ins : o.outs, ox = conn.dir > 0 ? o.x : o.x + o.w;
      const m = CARD_MARGIN_PX / s, inCard = conn.x >= o.x - m && conn.x <= o.x + o.w + m && conn.y >= o.y - m && conn.y <= o.y + o.h + m;
      let nk = -1, nd = Infinity;
      for (let k = 0; k < arr.length; k++) { const d = Math.hypot(ox - conn.x, portY(o, k) - conn.y); if (d < nd) { nd = d; nk = k; } }
      if (nk < 0) continue;
      if (inCard) { best = { node: o, idx: nk }; bd = 0; break; } // dropped on a card: it takes the nearest compatible port
      if (nd < bd) { bd = nd; best = { node: o, idx: nk }; }
    }
    conn.near = best; conn.elec = best ? 1 - bd * s / ELEC_PX : 0;
    conn.target = best && bd * s <= SNAP_PX ? best : null;
    // magnet: the wire's tip is drawn toward the nearest port, easing in as you approach (stops short so the arc still shows)
    const m = best ? Math.max(0, 1 - bd * s / MAG_PX) : 0;
    if (best) conn.pt = { x: best.node.x + (conn.dir > 0 ? 0 : best.node.w), y: portY(best.node, best.idx) };
    conn.snap = !!best && bd <= ringR();
    conn.pull += ((conn.snap ? 1 : MAG_PULL * m * m * (3 - 2 * m)) - conn.pull) * .3;
  }
  if (nearA > .01) { drawNear(vis, nearA); drawConn(); }
  const mode = nearA > .5 ? 'NEAR' : s >= .07 ? 'MID' : 'FAR';
  hud.textContent = `${mode}  zoom ${s.toFixed(3)}  |  ${nodes.length} nodes ${edges.length} edges ${groups.length} groups  |  drawn ${vis.size} nodes ${nearA > .01 ? drawnEdges : 0} edges  |  ${(performance.now() - t0).toFixed(1)} ms\n` +
    `scroll=zoom drag=pan click=select path (esc clears)  drag from a port to connect  keys 1-${comps.length}: jump to pipeline` + (selected ? `\nselected ${selected.name}: ${selNodes.size} nodes on path` : '');
}
requestAnimationFrame(frame);
</script>
